name: Test OpenHarmony OHScrcpy

on:
  workflow_call:

jobs:
  test-all:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Python
        uses: setup-python@0.0.1
        with:
          python-version: '3.8.18'

      - name: Configure pip mirror
        run: |
          mkdir -p ~/.pip
          echo "[global]" > ~/.pip/pip.conf
          echo "index-url = https://pypi.tuna.tsinghua.edu.cn/simple" >> ~/.pip/pip.conf
          echo "timeout = 120" >> ~/.pip/pip.conf
      
      - name: Install test dependencies
        run: |
          cd repo_workspace
          pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -r Client/requirements.txt

      - name: Install system dependencies (FFmpeg for PyAV)
        run: |
          cd repo_workspace
          yum install -y epel-release
          yum makecache
          yum install -y ffmpeg ffmpeg-devel
      
      - name: Run pytest with coverage
        run: |
          cd repo_workspace
          pytest tests/ -v --tb=short --cov=Client --cov-report=term-missing

      - name: Run type check (mypy)
        run: |
          cd repo_workspace
          mypy Client/ --ignore-missing-imports --no-error-summary || true
