name: Build OpenHarmony OHScrcpy Linux

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'OpenHarmony_Scrcpy_V*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-all:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1

      #- name: Setup Python
      #  uses: setup-python@0.0.1
      #  with:
      #    python-version: '3.8.18'

      - name: Install Python via Miniconda
        run: |
          # 1. 下载 Miniconda 安装包（从清华大学镜像站，真实有效）
          curl -O https://mirrors.tuna.tsinghua.edu.cn/anaconda/miniconda/Miniconda3-latest-Linux-x86_64.sh
  
          # 2. 安装 Miniconda（静默模式，安装到 $HOME/miniconda）
          bash Miniconda3-latest-Linux-x86_64.sh -b -p $HOME/miniconda
  
          # 3. 配置环境变量，使 conda 立即生效
          export PATH="$HOME/miniconda/bin:$PATH"
  
          # 4. 配置 conda 使用清华镜像源（加速后续包下载）
          conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/
          conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free/
          conda config --set show_channel_urls yes
  
          # 5. 创建一个名为 py311 的 Python 3.11 环境，并激活
          conda create -n py311 python=3.11.9 -y
          source activate py311
  
          # 6. 验证
          python --version
          python -c "import sysconfig; print(sysconfig.get_config_var('Py_ENABLE_SHARED'))"

      - name: Configure pip mirror
        run: |
          cd repo_workspace
          mkdir -p ~/.pip
          echo "[global]" > ~/.pip/pip.conf
          echo "index-url = https://pypi.tuna.tsinghua.edu.cn/simple" >> ~/.pip/pip.conf
          echo "timeout = 120" >> ~/.pip/pip.conf
      
      - name: Install test dependencies
        run: |
          cd repo_workspace
          pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -r Client/requirements.txt

      - name: Run pytest with coverage
        run: |
          cd repo_workspace
          python -m pytest tests/ -v --tb=short --cov=Client --cov-report=term-missing

      - name: Run type check (mypy)
        run: |
          cd repo_workspace
          python -m mypy Client/ --ignore-missing-imports --no-error-summary || true
  
  build-executer:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Python
        uses: setup-python@0.0.1
        with:
          python-version: '3.8.18'

      - name: Configure pip mirror
        run: |
          cd repo_workspace
          mkdir -p ~/.pip
          echo "[global]" > ~/.pip/pip.conf
          echo "index-url = https://pypi.tuna.tsinghua.edu.cn/simple" >> ~/.pip/pip.conf
          echo "timeout = 120" >> ~/.pip/pip.conf

      - name: Install system dependencies
        run: |
          cd repo_workspace
          pip install --upgrade pip
          pip install -r Client/requirements.txt
          pip install pyinstaller

      - name: Build Executer
        run: |
          cd repo_workspace/Package
          chmod +x build_executer.sh
          ./build_executer.sh

      - name: Check Executer output
        run: |
          cd repo_workspace
          OUTPUT_DIR="Package/Executer/output/Linux/x64"
          if [ -d "$OUTPUT_DIR" ]; then
            echo "Checking Executer output at: $OUTPUT_DIR"
            ls -la "$OUTPUT_DIR"
            ZIP_COUNT=$(find "$OUTPUT_DIR" -name "*.zip" -o -name "*.exe" | wc -l)
            if [ "$ZIP_COUNT" -gt 0 ]; then
              echo "Executer package found"
            else
              echo "::error::No Executer package found in $OUTPUT_DIR"
              exit 1
            fi
          else
            echo "::error::Output directory not found: $OUTPUT_DIR"
            exit 1
          fi

      #- name: Upload Executer artifact
      #  uses: upload-artifact@0.0.1
      #  with:
      #    name: OHScrcpy-Executer-Linux-x64
      #    paths: repo_workspace/Package/Executer/output/Linux/x64/
      #    retention-days: 30

  build-installer:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Python
        uses: setup-python@0.0.1
        with:
          python-version: '3.8.18'

      - name: Configure pip mirror
        run: |
          cd repo_workspace
          mkdir -p ~/.pip
          echo "[global]" > ~/.pip/pip.conf
          echo "index-url = https://pypi.tuna.tsinghua.edu.cn/simple" >> ~/.pip/pip.conf
          echo "timeout = 120" >> ~/.pip/pip.conf

      - name: Install system dependencies
        run: |
          cd repo_workspace
          pip install --upgrade pip
          pip install -r Client/requirements.txt
          pip install pyinstaller

      - name: Build Installer
        run: |
          cd repo_workspace/Package
          chmod +x build_installer.sh
          ./build_installer.sh

      - name: Check Installer output
        run: |
          cd repo_workspace
          OUTPUT_DIR="Package/Installer/output/Linux/x64"
          if [ -d "$OUTPUT_DIR" ]; then
            echo "Checking Installer output at: $OUTPUT_DIR"
            ls -la "$OUTPUT_DIR"
            ZIP_COUNT=$(find "$OUTPUT_DIR" -name "*.zip" -o -name "*.exe" | wc -l)
            if [ "$ZIP_COUNT" -gt 0 ]; then
              echo "Executer package found"
            else
              echo "::error::No Installer package found in $OUTPUT_DIR"
              exit 1
            fi
          else
            echo "::error::Output directory not found: $OUTPUT_DIR"
            exit 1
          fi

      #- name: Upload Installer artifact
      #  uses: upload-artifact@0.0.1
      #  with:
      #    name: OHScrcpy-Installer-Linux-x64
      #    paths: repo_workspace/Package/Installer/output/Linux/x64/
      #    retention-days: 30
