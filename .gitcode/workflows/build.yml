name: Build OpenHarmony OHScrcpy Linux

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'OpenHarmony_Scrcpy_V*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Run All Tests
    uses: ./.gitcode/workflows/test.yml
  
  build-executer:
    runs-on: euleros-2.10.1
    needs: test
    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Python
        uses: setup-python@0.0.1
        with:
          python-version: '3.8.18'

      - name: Install system dependencies
        run: |
          cd repo_workspace
          yum install -y ffmpeg ffmpeg-devel
          pip install --upgrade pip
          pip install -r Client/requirements.txt
          pip install pyinstaller

      - name: Build Executer
        run: |
          cd repo_workspace/Package
          chmod +x build_executer.sh
          ./build_executer.sh

      - name: Check Executer output
        run: |
          cd repo_workspace
          OUTPUT_DIR="Package/Executer/output/Linux/x64"
          if [ -d "$OUTPUT_DIR" ]; then
            echo "Checking Executer output at: $OUTPUT_DIR"
            ls -la "$OUTPUT_DIR"
            ZIP_COUNT=$(find "$OUTPUT_DIR" -name "*.zip" -o -name "*.exe" | wc -l)
            if [ "$ZIP_COUNT" -gt 0 ]; then
              echo "Executer package found"
            else
              echo "::error::No Executer package found in $OUTPUT_DIR"
              exit 1
            fi
          else
            echo "::error::Output directory not found: $OUTPUT_DIR"
            exit 1
          fi

      - name: Upload Executer artifact
        uses: upload-artifact@0.0.1
        with:
          name: OHScrcpy-Executer-Linux-x64
          paths: repo_workspace/Package/Executer/output/Linux/x64/
          retention-days: 30

  build-installer:
    runs-on: euleros-2.10.1
    needs: test
    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Python
        uses: setup-python@0.0.1
        with:
          python-version: '3.8.18'

      - name: Install system dependencies
        run: |
          cd repo_workspace
          yum install -y ffmpeg ffmpeg-devel zip
          pip install --upgrade pip
          pip install -r Client/requirements.txt
          pip install pyinstaller

      - name: Build Installer
        run: |
          cd repo_workspace/Package
          chmod +x build_installer.sh
          ./build_installer.sh

      - name: Check Installer output
        run: |
          cd repo_workspace
          OUTPUT_DIR="Package/Installer/output/Linux/x64"
          if [ -d "$OUTPUT_DIR" ]; then
            echo "Checking Installer output at: $OUTPUT_DIR"
            ls -la "$OUTPUT_DIR"
            ZIP_COUNT=$(find "$OUTPUT_DIR" -name "*.zip" -o -name "*.exe" | wc -l)
            if [ "$ZIP_COUNT" -gt 0 ]; then
              echo "Executer package found"
            else
              echo "::error::No Installer package found in $OUTPUT_DIR"
              exit 1
            fi
          else
            echo "::error::Output directory not found: $OUTPUT_DIR"
            exit 1
          fi

      - name: Upload Installer artifact
        uses: upload-artifact@0.0.1
        with:
          name: OHScrcpy-Installer-Linux-x64
          paths: repo_workspace/Package/Installer/output/Linux/x64/
          retention-days: 30
