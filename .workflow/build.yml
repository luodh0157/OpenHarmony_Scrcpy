version: '1.0'
name: release
displayName: OHScrcpy版本发布
triggers:
  trigger: auto
  push:
    branches:
      include:
        - main
  pr:
    branches:
      include:
        - main

stages:
  - name: test-stage
    displayName: OHScrcpy全量测试
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@python
        name: test-all
        displayName: 运行所有测试
        pythonVersion: '3.12'
        commands:
          - curl -L -o Miniforge3-Linux-x86_64.sh "https://mirrors.tuna.tsinghua.edu.cn/github-release/conda-forge/miniforge/LatestRelease/Miniforge3-Linux-x86_64.sh"
          - bash Miniforge3-Linux-x86_64.sh -b -p $HOME/miniforge3
          - $HOME/miniforge3/bin/conda init bash
          - source $HOME/miniforge3/etc/profile.d/conda.sh
          - conda config --remove-key channels
          - conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
          - conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/r
          - conda config --set custom_channels.conda-forge https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set custom_channels.bioconda https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set custom_channels.pytorch https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set show_channel_urls yes
          - conda config --set channel_priority strict
          - conda config --set solver libmamba
          - conda clean -i -y
          - conda create -n py311 python=3.11.9 -y
          - conda activate py311
          - python --version
          - python -c "import sysconfig; print(sysconfig.get_config_var('Py_ENABLE_SHARED'))"
          - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - python -m pip install --upgrade pip
          - pip install -r tests/requirements-test.txt
          - pip install -r Client/requirements.txt
          - python -m pytest tests/ -v --tb=short --cov=Client --cov-report=term-missing
          - python -m mypy Client/ --ignore-missing-imports --no-error-summary || true
        caches: []
        notify: []
        strategy:
          retry: '0'
          timeout: null
  - name: build-stage
    displayName: OHScrcpy构建
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@python
        name: build-executer
        displayName: 构建 Executer
        pythonVersion: '3.12'
        commands:
          - curl -L -o Miniforge3-Linux-x86_64.sh "https://mirrors.tuna.tsinghua.edu.cn/github-release/conda-forge/miniforge/LatestRelease/Miniforge3-Linux-x86_64.sh"
          - bash Miniforge3-Linux-x86_64.sh -b -p $HOME/miniforge3
          - $HOME/miniforge3/bin/conda init bash
          - source $HOME/miniforge3/etc/profile.d/conda.sh
          - conda config --remove-key channels
          - conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
          - conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/r
          - conda config --set custom_channels.conda-forge https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set custom_channels.bioconda https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set custom_channels.pytorch https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set show_channel_urls yes
          - conda config --set channel_priority strict
          - conda config --set solver libmamba
          - conda clean -i -y
          - conda create -n py311 python=3.11.9 -y
          - conda activate py311
          - python --version
          - python -c "import sysconfig; print(sysconfig.get_config_var('Py_ENABLE_SHARED'))"
          - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - python -m pip install --upgrade pip
          - pip install -r Client/requirements.txt
          - pip install pyinstaller
          - cd Package
          - chmod +x build_executer.sh
          - ./build_executer.sh
        artifacts:
          - name: EXECUTER_ARTIFACT
            path:
              - Package/Executer/output/Linux/x64/
        caches: []
        notify: []
        strategy:
          retry: '0'
      - step: publish@general_artifacts
        name: publish-executer
        displayName: 上传 Executer 制品
        dependArtifact: EXECUTER_ARTIFACT
        artifactName: OHScrcpy-Executer-Linux-x64
        notify: []
        strategy:
          retry: '0'
        dependsOn: build-executer
      - step: build@python
        name: build-installer
        displayName: 构建 Installer
        pythonVersion: '3.12'
        commands:
          - curl -L -o Miniforge3-Linux-x86_64.sh "https://mirrors.tuna.tsinghua.edu.cn/github-release/conda-forge/miniforge/LatestRelease/Miniforge3-Linux-x86_64.sh"
          - bash Miniforge3-Linux-x86_64.sh -b -p $HOME/miniforge3
          - $HOME/miniforge3/bin/conda init bash
          - source $HOME/miniforge3/etc/profile.d/conda.sh
          - conda config --remove-key channels
          - conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
          - conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/r
          - conda config --set custom_channels.conda-forge https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set custom_channels.bioconda https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set custom_channels.pytorch https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud
          - conda config --set show_channel_urls yes
          - conda config --set channel_priority strict
          - conda config --set solver libmamba
          - conda clean -i -y
          - conda create -n py311 python=3.11.9 -y
          - conda activate py311
          - python --version
          - python -c "import sysconfig; print(sysconfig.get_config_var('Py_ENABLE_SHARED'))"
          - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - python -m pip install --upgrade pip
          - pip install -r Client/requirements.txt
          - pip install pyinstaller
          - cd Package
          - chmod +x build_installer.sh
          - ./build_installer.sh
        artifacts:
          - name: INSTALLER_ARTIFACT
            path:
              - Package/Installer/output/Linux/x64/
        caches: []
        notify: []
        strategy:
          retry: '0'
      - step: publish@general_artifacts
        name: publish-installer
        displayName: 上传 Installer 制品
        dependArtifact: INSTALLER_ARTIFACT
        artifactName: OHScrcpy-Installer-Linux-x64
        notify: []
        strategy:
          retry: '0'
        dependsOn: build-installer
  - name: release-stage
    displayName: 版本号标记
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: publish@release_artifacts
        name: release-executer
        displayName: Executer版本号标记
        dependArtifact: OHScrcpy-Executer-Linux-x64
        version: 2.2.0.0
        autoIncrement: true
        notify: []
        strategy:
          retry: '0'
      - step: publish@release_artifacts
        name: release-installer
        displayName: Installer版本号标记
        dependArtifact: OHScrcpy-Installer-Linux-x64
        version: 2.2.0.0
        autoIncrement: true
        notify: []
        strategy:
          retry: '0'
